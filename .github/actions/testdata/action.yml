name: Downloaded test data
description: >
  The third-party test files that are fetched rather than committed (TestData/fetch/*.sh, tests/oracle/fetch_*.py),
  through a cache shared by all operating systems. mode "fetch" downloads them and writes their references when the
  cache has none (in a debian:trixie container: python 3, curl, git, zstd, ImageMagick, libtiff 4.7 - the references of libtiff's
  sample pictures depend on the libtiff version); mode "restore" restores them into testdata/ and fails without them.
inputs:
  mode:
    description: fetch or restore
    required: true
runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      run: echo "key=testdata-v2-${{ hashFiles('tests/oracle/fetch_*.py', 'tests/oracle/gen_tiff.py', 'tests/oracle/pxref.py', 'tests/oracle/requirements.txt', 'testdata/fetch/*', 'testdata/fixtures/webp/vectors/refs.txt', 'testdata/fixtures/jp2/conformance/limits.txt', 'testdata/fixtures/tga/gimp/sha256.txt', 'testdata/fixtures/mpo/pillow/sha256.txt', 'testdata/fixtures/av1/aom/sha256.txt', 'testdata/fixtures/avif/libavif/refs.txt') }}" >> "$GITHUB_OUTPUT"

    - name: Look up downloads
      if: inputs.mode == 'fetch'
      id: lookup
      uses: actions/cache/restore@v6
      with:
        key: ${{ steps.key.outputs.key }}
        enableCrossOsArchive: true
        lookup-only: true
        path: |
          testdata/downloads
          testdata/fixtures/webp/vectors/*.webp
          testdata/fixtures/jp2/conformance/codestreams_*
          testdata/fixtures/jp2/conformance/htj2k_*
          testdata/fixtures/jp2/conformance/reference_*
          testdata/fixtures/tga/gimp/*.tga
          testdata/fixtures/tga/gimp/*.png
          testdata/fixtures/mpo/pillow/*.mpo
          testdata/fixtures/av1/aom/*.ivf
          testdata/fixtures/av1/aom/*.md5
          testdata/fixtures/avif/libavif/*.avif
          testdata/fixtures/avif/libavif/io/
          testdata/fixtures/avif/libavif/README.md
          testdata/fixtures/mpo/pillow/*.jpg

    - name: Fetch
      if: inputs.mode == 'fetch' && steps.lookup.outputs.cache-hit != 'true'
      shell: bash
      env:
        PIXCODEC_TESTDATA: ${{ github.workspace }}/testdata
      run: |
        set -e
        python3 -m venv .tmp/venv-fetch
        . .tmp/venv-fetch/bin/activate
        python -m pip install -q -r tests/oracle/requirements.txt
        python -c "import ctypes; ctypes.CDLL('libtiff.so.6')"
        if ! command -v magick > /dev/null; then
          bash tests/oracle/ci/install.sh magick
          export PATH="$(pwd)/.tmp/ci-tools/magick/bin:$PATH"
        fi
        magick -version | head -1
        # (Argon: 7 GB download, 30 GB unpacked; its test needs PIXCODEC_ARGON=1 and runs locally only)
        for f in testdata/fetch/*.sh; do case "$f" in *argon*) continue ;; esac; sh "$f"; done
        cd tests/oracle
        python fetch_tiff_samples.py
        python fetch_tiff_samples.py --aperio
        python fetch_tiff_samples.py --gdal
        python fetch_jpegls_conformance.py
        python fetch_jxl_conformance.py
        python fetch_dng_samples.py
        python fetch_dicom_samples.py
        du -sh "$PIXCODEC_TESTDATA/downloads"

    - name: Save downloads
      if: inputs.mode == 'fetch' && steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.key.outputs.key }}
        enableCrossOsArchive: true
        path: |
          testdata/downloads
          testdata/fixtures/webp/vectors/*.webp
          testdata/fixtures/jp2/conformance/codestreams_*
          testdata/fixtures/jp2/conformance/htj2k_*
          testdata/fixtures/jp2/conformance/reference_*
          testdata/fixtures/tga/gimp/*.tga
          testdata/fixtures/tga/gimp/*.png
          testdata/fixtures/mpo/pillow/*.mpo
          testdata/fixtures/av1/aom/*.ivf
          testdata/fixtures/av1/aom/*.md5
          testdata/fixtures/avif/libavif/*.avif
          testdata/fixtures/avif/libavif/io/
          testdata/fixtures/avif/libavif/README.md
          testdata/fixtures/mpo/pillow/*.jpg

    - name: Restore downloads
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v6
      with:
        key: ${{ steps.key.outputs.key }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true
        path: |
          testdata/downloads
          testdata/fixtures/webp/vectors/*.webp
          testdata/fixtures/jp2/conformance/codestreams_*
          testdata/fixtures/jp2/conformance/htj2k_*
          testdata/fixtures/jp2/conformance/reference_*
          testdata/fixtures/tga/gimp/*.tga
          testdata/fixtures/tga/gimp/*.png
          testdata/fixtures/mpo/pillow/*.mpo
          testdata/fixtures/av1/aom/*.ivf
          testdata/fixtures/av1/aom/*.md5
          testdata/fixtures/avif/libavif/*.avif
          testdata/fixtures/avif/libavif/io/
          testdata/fixtures/avif/libavif/README.md
          testdata/fixtures/mpo/pillow/*.jpg
